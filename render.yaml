# Render blueprint: the Python API on the free plan.
services:
  - type: web
    name: meeting-in-the-middle-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # The rate limiter reads the visitor IP that Render's proxy appends to X-Forwarded-For
    # (TRUSTED_PROXY_HOPS below); uvicorn is not told to trust forwarded headers itself.
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Render's X-Forwarded-For is "<visitor>, <Cloudflare>, <Render load balancer>":
      # the visitor is the 3rd entry from the right (verified live 2026-11-24).
      - key: TRUSTED_PROXY_HOPS
        value: "3"
      - key: ALLOWED_ORIGINS
        value: https://jonobaker1998.github.io
